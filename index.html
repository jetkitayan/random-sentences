<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Random English Sentences</title>
<style>
/* ==================================================
   1. Reset / Base
================================================== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: sans-serif;
  background-color: #fafafa;
}

/* ==================================================
   2. Button Area (fixed)
================================================== */
#button-area {
  position: sticky;
  top: 0;
  width: 100%;
  padding: 65px 25px 13px;
  text-align: center;
  z-index: 999;
  touch-action: manipulation;
}

#button-area button:active {
  transform: translateY(1px);
  filter: brightness(0.95);
}
   
/* 共通幅 */
#button-area .row1,
#button-area .row2 {
  max-width: 1100px;
  margin: 0 auto;
}

/* 上段ボタン */
#button-area .row2 {
  display: grid;
  grid-template-columns: 605fr 395fr;
  gap: 23px;
  max-width: 900px;
}

/* 下段ボタン */
#button-area .row1 {
  display: flex;
  gap: 25px;
  margin-top: 25px;
  justify-content: center;
}


/* ==================================================
   3. Content Layout
================================================== */
#content {
  max-width: 1100px;
  padding-left: 40px;
  padding-right: 40px;
  padding-top: 20px;
}

/* 文章ブロック */
#sentence-frame{
  position: relative;
  margin-top: 25px;
}
#sentence-jp{ position: static; }
#sentence-en{ display:block; margin-top: 1.2em; min-height: 3.2em; }

/* 回数表示 */
#last-shown {
  margin-top: 0px;
}


/* ==================================================
   4. Typography
================================================== */
#sentence-jp,
#sentence-en {
  font-size: 52px;
  line-height: 1.6;
  color: #000;
}

.top-meta {
  white-space: pre-line;
  padding-bottom: 46px;
}


/* ==================================================
   5. Effects / Utilities
================================================== */
.hidden {
  opacity: 0;
}

#sentence-en {
  transition: opacity 0.12s linear;
}

#button-area button{
  padding: 45px 50px;
  font-size: 40px;
  min-height: 140px;

  border: 3px solid #000;
  border-radius: 16px;
  background-color: #d9d9d9;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* 表示履歴一覧：初期は非表示 */
#statsArea {
  display: none;
  padding: 20px 40px;
}

#statsArea table {
  border-collapse: collapse;
  width: 100%;
}

#statsArea th,
#statsArea td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: left;
}

#button-area .row1 button {
  width: 160px;       /* ← 今より少し細く */
  padding: 32px 0;    /* 横paddingを無くす */
}

#button-area button {
  color: #000;
}

#jpText {
  margin-top: 12px;   /* ← 好きな分だけ */
}

button.is-locked {
  outline: 4px solid #007aff;
  outline-offset: 4px;
}
/* ==================================================
   6. Add Sentence UI
================================================== */
#simpleAddArea{
  padding: 30px 40px;
  max-width: 1100px;
}

#customText{
  width: 100%;
  min-height: 120px;
  font-size: 26px;
  padding: 15px;
  border: 2px solid #000;
  border-radius: 12px;
  resize: vertical;
}

.simpleButtons{
  margin-top: 15px;
  display: flex;
  gap: 15px;
}

.simpleButtons button{
  padding: 20px 25px;
  font-size: 24px;
  border-radius: 12px;
}

#addMsg{
  margin-top: 10px;
  font-size: 20px;
}
</style>
</head>
<body>

<div id="button-area">
  <!-- 表示順：上段＝Show/☆Only、下段＝OKほか -->
  <div class="row2">
    <button id="showBtn">Random</button>
    <button id="showStarBtn">★ Only</button>
  </div>

  <div class="row1">
    <button id="okBtn" disabled>OK</button>
    <button id="starBtn" disabled>★</button>
    <button id="resetBtn">Reset</button>
    <button id="statsBtn">Stats</button>
    <button id="copyBtn">Copy</button>
  </div>
</div>
<div id="content">
  <div id="sentence-frame">
    <div id="sentence-jp">
      <div class="top-meta" id="topMeta">Press "Show Random" to start</div>
      <div id="jpText"></div>
    </div>
    <div id="sentence-en"></div>
  </div>
  <div id="simpleAddArea">
    <textarea id="customText" placeholder="1文を入力"></textarea>
    <div class="simpleButtons">
      <button id="addSimpleBtn">Add</button>
      <button id="customOnlyBtn">Custom Only</button>
      <button id="clearCustomBtn">Clear</button>
    </div>
    <div id="addMsg"></div>
  </div>
  <div id="last-shown"></div>
</div>

<!-- 表示履歴一覧 -->
<div id="statsArea">
  <h3>📊 表示履歴一覧</h3>
  <table>
    <thead>
      <tr>
        <th>日本語</th>
        <th>英語</th>
        <th>YES押下</th>
        <th>★</th>
        <th>表示回数</th>
      </tr>
    </thead>
    <tbody id="statsBody"></tbody>
  </table>
</div>

<script>
/* ========= 状態 ========= */
let dataReady = false;
let nextEn = null;

let allSentences = [];
const params = new URLSearchParams(window.location.search);
const fileParam = params.get("file") || "default";
const jsonFile = `${fileParam}.json`;
const keyPrefix = `randomApp_${fileParam}_`;

const sentenceJpEl = document.getElementById("sentence-jp");
const sentenceEnEl = document.getElementById("sentence-en");
const showBtnEl    = document.getElementById("showBtn");
showBtnEl.disabled = true;
document.getElementById("showStarBtn").disabled = true;
const okBtnEl      = document.getElementById("okBtn");
const starBtnEl    = document.getElementById("starBtn");
  
/* 永続データのロード */
let shownCounts = JSON.parse(localStorage.getItem(keyPrefix + "shownCounts")) || {};
let yesMarks    = JSON.parse(localStorage.getItem(keyPrefix + "yesMarks")) || {};
let starMarks   = JSON.parse(localStorage.getItem(keyPrefix + "starMarks")) || {};
let remainingArr = JSON.parse(localStorage.getItem(keyPrefix + "remaining")) || [];
let remainingSet = new Set(remainingArr);
let lastShownMap= JSON.parse(localStorage.getItem(keyPrefix + "lastShown")) || {};

let lastShowMode = "all"; // "all" | "star"

function getOkCount() {
  return Object.values(yesMarks).filter(v => v === true).length;
}

function buildOkCountText() {
  const okCount = getOkCount();
  const total = allSentences.length;
  return `OK（${okCount} / ${total}）`;
}
   
/* 今日カウント */
function getTodayYMD() {
  const now = new Date();
  const tz = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
  const y = tz.getFullYear();
  const m = String(tz.getMonth() + 1).padStart(2, '0');
  const d = String(tz.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
const todayKey = getTodayYMD();
const todayCountsKey = keyPrefix + "shownCounts_" + todayKey;
let todayCounts = JSON.parse(localStorage.getItem(todayCountsKey)) || {};

/* キャッシュ集計 */
let totalShownCached = Object.values(shownCounts).reduce((a,b)=>a+(b||0),0);
let todayShownCached = Object.values(todayCounts).reduce((a,b)=>a+(b||0),0);

/* 画面状態 */
let currentSentence = null;
// 0: ランダム / 1: 最少回数 / 2: 最古
let showMode = 0;
   
/* ===== 直近カウントを「分リングバッファ」にする（最終形・超高速） ===== */
const minuteKey = keyPrefix + "minuteRing_v1";

// { baseMin:number, ring:number[60] }
// baseMin = ring[0] が指す Unix 分
let minuteRing = (() => {
  try {
    const o = JSON.parse(localStorage.getItem(minuteKey));
    if (!o || !Number.isFinite(o.baseMin) || !Array.isArray(o.ring) || o.ring.length !== 60) {
      throw 0;
    }
    return o;
  } catch {
    return {
      baseMin: Math.floor(Date.now() / 60000),
      ring: Array(60).fill(0),
    };
  }
})();

let ringSaveScheduled = false;
function scheduleSaveMinuteRing() {
  if (ringSaveScheduled) return;
  ringSaveScheduled = true;
  setTimeout(() => {
    try {
      localStorage.setItem(minuteKey, JSON.stringify(minuteRing));
    } catch {}
    ringSaveScheduled = false;
  }, 300);
}

function advanceRingTo(nowMin) {
  let diff = nowMin - minuteRing.baseMin;
  if (diff <= 0) return;

  if (diff >= 60) {
    minuteRing.ring.fill(0);
    minuteRing.baseMin = nowMin;
    return;
  }

  // shift() をやめて、手動で左詰め（60固定なので速い）
  const r = minuteRing.ring;
  for (let i = 0; i < 60 - diff; i++) r[i] = r[i + diff];
  for (let i = 60 - diff; i < 60; i++) r[i] = 0;

  minuteRing.baseMin = nowMin;
}

function addNowCountFast() {
  const nowMin = Math.floor(Date.now() / 60000);
  advanceRingTo(nowMin);
  minuteRing.ring[59]++;
  scheduleSaveMinuteRing();
}

function getLastMinutesCount(min) {
  const nowMin = Math.floor(Date.now() / 60000);
  advanceRingTo(nowMin);

  const n = Math.min(60, Math.max(1, min));
  let sum = 0;
  for (let i = 60 - n; i < 60; i++) sum += minuteRing.ring[i];
  return sum;
}

const getLast1HourCount = () => getLastMinutesCount(60);
const getLast5MinCount  = () => getLastMinutesCount(5);

function humanElapsed(iso){
  try{
    const t=new Date(iso).getTime(), s=Math.floor((Date.now()-t)/1000);
    if(s<60) return `${s}秒前`;
    const m=Math.floor(s/60); if(m<60) return `${m}分前`;
    const h=Math.floor(m/60); if(h<24) return `${h}時間前`;
    return `${Math.floor(h/24)}日前`;
  }catch{return""}
}

function formatTokyoYmdHm(date){
  // date: Date
  // Asia/Tokyo の “各要素” を取り出す（ブラウザのローカルTZに影響されにくい）
  const parts = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false,
  }).formatToParts(date);

  const get = (type) => parts.find(p => p.type === type)?.value ?? "";
  const y = get("year");
  const m = get("month");
  const d = get("day");
  const hh = get("hour");
  const mm = get("minute");
  return `${m}/${d} ${hh}:${mm}`;
}

// 「5日前（yyyy/mm/dd hh:mm）」を返す
function humanElapsedWithDate(iso){
  try{
    if (!iso) return "なし";
    const t = new Date(iso);
    const diffSec = Math.floor((Date.now() - t.getTime()) / 1000);

    let rel;
    if (diffSec < 60) rel = `${diffSec}秒前`;
    else {
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) rel = `${diffMin}分前`;
      else {
        const diffHour = Math.floor(diffMin / 60);
        if (diffHour < 24) rel = `${diffHour}時間前`;
        else rel = `${Math.floor(diffHour / 24)}日前`;
      }
    }

    return `${rel}（${formatTokyoYmdHm(t)}）`;
  }catch{
    return "なし";
  }
}
   
// ===== 保存を「まとめて」やる（超重要）=====
const dirtyKeys = new Set();
let flushTimer = null;

function markDirty(key) {
  dirtyKeys.add(key);
  if (flushTimer) return;

  // まずはすぐ描画させるため、少し遅らせてからまとめて保存
  flushTimer = setTimeout(flushSaves, 800);
}

function flushSaves() {
  flushTimer = null;

  // アイドル時に回す（対応ブラウザは多い）
  const run = () => {
    try {
      for (const key of dirtyKeys) {
        // keyごとに「今の最新オブジェクト」を保存
        if (key === keyPrefix+"shownCounts") localStorage.setItem(key, JSON.stringify(shownCounts));
        else if (key === todayCountsKey)     localStorage.setItem(key, JSON.stringify(todayCounts));
        else if (key === keyPrefix+"lastShown") localStorage.setItem(key, JSON.stringify(lastShownMap));
        else if (key === keyPrefix+"yesMarks")  localStorage.setItem(key, JSON.stringify(yesMarks));
        else if (key === keyPrefix+"starMarks") localStorage.setItem(key, JSON.stringify(starMarks));
        else if (key === keyPrefix+"remaining") {
          localStorage.setItem(key, JSON.stringify(remainingArr));
        }
      }
    } catch {}
    dirtyKeys.clear();
  };

  if ("requestIdleCallback" in window) {
    requestIdleCallback(run, { timeout: 1000 });
  } else {
    setTimeout(run, 0);
  }
}

// ページを閉じる/裏に回る直前に強制保存
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushSaves();
});

/* en → sentence のマップ */
const byEn = Object.create(null);

const simpleKey = keyPrefix + "simpleCustom";
let simpleCustomList = JSON.parse(localStorage.getItem(simpleKey)) || [];

/* ========= データ読み込み ========= */
fetch(jsonFile)
  .then(r => r.json())
   .then(data => {
   
     // 1) JSONを読み込む
     allSentences = data;
   
     // 2) Custom を allSentences に「追加」して統合
     //    ※ en をキーにする都合上、en と jp を同じ文字列にする
     const list = JSON.parse(localStorage.getItem(simpleKey)) || [];
     for (const t of list) {
       const text = (t || "").trim();
       if (!text) continue;
   
       // JSON側と被ったら入れない（任意）
       // 既に同じenがあると byEn が上書きされるので回避
       if (allSentences.some(s => s.en === text)) continue;
   
       allSentences.push({ jp: text, en: text });
     }
   
     // 3) byEn を作り直す（必須）
     for (const k in byEn) delete byEn[k];
     for (const s of allSentences) byEn[s.en] = s;
   
     // 4) remaining 初期化（初回だけ）
     if (remainingArr.length === 0) {
       remainingArr = allSentences.map(s => s.en);
       remainingSet = new Set(remainingArr);
       localStorage.setItem(keyPrefix + "remaining", JSON.stringify(remainingArr));
     } else {
       remainingSet = new Set(remainingArr);
     }
   
     // 5) 準備完了
     dataReady = true;
     showBtnEl.disabled = false;
     document.getElementById("showStarBtn").disabled = false;
   })
  .catch(err => {
    topMetaEl.textContent = `JSON読み込み失敗: ${jsonFile}`;
    console.error(err);
});

/* ========= スターUI（☆固定表示） ========= */
function updateStarUi(){
  const starBtn = document.getElementById("starBtn");
  if (!currentSentence) {
    starBtn.disabled = true;
  } else {
    starBtn.disabled = false;
  }
  // 見た目は常に☆固定
  starBtn.textContent = "★";
}

const topMetaEl = document.getElementById("topMeta");
const jpTextEl  = document.getElementById("jpText");
const enEl      = document.getElementById("sentence-en");

function presentSentenceByEn(en){
  const s = byEn[en];
  if (!s) return;
  currentSentence = s;

  okBtnEl.disabled = false;
  starBtnEl.disabled = false;
  updateStarUi();
   
  // フェードアウト
  sentenceJpEl.classList.add("hidden");
  sentenceEnEl.classList.add("hidden");

  requestAnimationFrame(() => {
    // テキスト差し替え
    jpTextEl.textContent = s.jp;
    enEl.textContent     = s.en;

    // フェードイン
    sentenceJpEl.classList.remove("hidden");
    sentenceEnEl.classList.remove("hidden");
  });

  // 重い処理はさらに後ろ
   setTimeout(() => {
     const newShown = (shownCounts[en] || 0) + 1;
     shownCounts[en] = newShown;
     markDirty(keyPrefix+"shownCounts");
   
     // ★ 総回数キャッシュも増やす
     totalShownCached++;
   
     todayCounts[en] = (todayCounts[en] || 0) + 1;
     markDirty(todayCountsKey);
   
     // ★ 今日回数キャッシュも増やす
     todayShownCached++;
   
     addNowCountFast();
   
     const prevIso = lastShownMap[en];
     const prevText = humanElapsedWithDate(prevIso);
     lastShownMap[en] = new Date().toISOString();
     markDirty(keyPrefix+"lastShown");
   
     const starMark = starMarks[en] ? "★" : "";
     topMetaEl.textContent =
        `${newShown}回目${starMark}${buildCountsInlineText()}\n` +
        `${prevText}\n` +
        `${buildOkCountText()}`;
   }, 0);
}

/* ========= 通常ランダム表示 ========= */
function showRandom(){

  if (!dataReady) {
    topMetaEl.textContent = "Loading...";
    return;
  }
   
  // 完了チェック
  if (remainingArr.length === 0) {
    topMetaEl.textContent = "すべての英文を表示しました！";
    jpTextEl.textContent = "";
    sentenceEnEl.textContent = "";
    return;
  }

  // ★ 先読みがあれば即それを使う
  if (!nextEn) {
    prepareNext(); // 初回だけ
  }

  const en = nextEn;
  nextEn = null;   // 消費

  presentSentenceByEn(en);

  // ★ 表示後、裏で次を仕込む
  requestAnimationFrame(prepareNext);

  lastShowMode = "all";
}

/* ========= ☆のみランダム表示 ========= */
function showRandomStarred(){
  let pool = remainingArr.filter(en => !!starMarks[en]);
  if (pool.length === 0) {
    pool = Object.keys(starMarks).filter(en => starMarks[en]);
  }
  if (pool.length === 0) {
    alert("☆が付いた英文がありません。先に『☆』でお気に入り登録してください。");
    return;
  }
  const en = pickRandomFast(pool, currentSentence?.en);
  lastShowMode = "star";
  presentSentenceByEn(en);
}

/* ========= OK確定 ========= */
function confirmSentence(){
  if (!currentSentence) return;
  yesMarks[currentSentence.en] = true;
  markDirty(keyPrefix+"yesMarks");

  remainingSet.delete(currentSentence.en);  // O(1)

  // 配列は次の ShowRandom の前にまとめて再生成
  remainingArr = Array.from(remainingSet);
  
  markDirty(keyPrefix + "remaining");

  if (remainingArr.length > 0) showRandom();
  else {
    topMetaEl.textContent = "すべての英文を表示しました！";
    jpTextEl.textContent = "";
    document.getElementById("sentence-en").textContent = "";
    document.getElementById("last-shown").textContent = "";
    document.getElementById("showBtn").disabled = true;
    document.getElementById("okBtn").disabled = true;
    document.getElementById("starBtn").disabled = true;
  }
}

/* ========= ☆トグル（押したら次へ／見た目は☆固定） ========= */
function toggleStar(){
  if (!currentSentence) return;
  const en = currentSentence.en;
  const now = !starMarks[en];
  starMarks[en] = now;
  markDirty(keyPrefix+"starMarks");

  updateStarUi();  // ラベルは常に「☆」

  if (lastShowMode === "star") showRandomStarred();
  else showRandom();
}

/* ========= リセット ========= */
function clearDailyCounts(){
  const prefix = keyPrefix + "shownCounts_";
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const k = localStorage.key(i);
    if (k && k.startsWith(prefix)) localStorage.removeItem(k);
  }
}
function resetData(){
  if (!confirm("Reset？")) return;
  localStorage.removeItem(keyPrefix+"shownCounts");
  localStorage.removeItem(keyPrefix+"remaining");
  localStorage.removeItem(keyPrefix+"yesMarks");
  localStorage.removeItem(keyPrefix+"lastShown");
  localStorage.removeItem(keyPrefix+"starMarks");
  localStorage.removeItem(minuteKey);
  minuteRing = { baseMin: Math.floor(Date.now() / 60000), ring: Array(60).fill(0) };
  clearDailyCounts();

  shownCounts = {}; yesMarks = {}; lastShownMap = {}; starMarks = {};
  totalShownCached = 0; todayShownCached = 0;
  todayCounts = {}; localStorage.removeItem(todayCountsKey);

  remainingArr = allSentences.map(s => s.en);
  remainingSet = new Set(remainingArr);
  currentSentence = null;
  topMetaEl.textContent = 'Press "Show Random" to start';
  jpTextEl.textContent = "";
  document.getElementById("sentence-en").textContent = "";
  document.getElementById("last-shown").textContent = "";
  document.getElementById("showBtn").disabled = false;
  document.getElementById("okBtn").disabled = true;
  document.getElementById("starBtn").disabled = true;
  document.getElementById("statsArea").style.display = "none";

  localStorage.removeItem(simpleKey);
  simpleCustomList = [];
}

/* ========= Stats & Copy ========= */
function showStats(){
  const tbody = document.getElementById("statsBody");
  tbody.innerHTML = "";
  for (const s of allSentences) {
    const c = shownCounts[s.en] || 0;
    const yes = yesMarks[s.en] ? "●" : "○";
    const star = starMarks[s.en] ? "★" : "☆";
    tbody.innerHTML += `
      <tr>
        <td>${s.en}</td>
        <td>${s.jp}</td>
        <td style="text-align:center;">${yes}</td>
        <td style="text-align:center;">${star}</td>
        <td style="text-align:center;">${c}</td>
      </tr>`;
  }
  document.getElementById("statsArea").style.display = "block";
}
  
function copyStats(){
  const table = document.querySelector("#statsArea table");
  if (!table) { alert("一覧が表示されていません。"); return; }
  let text = "";
  table.querySelectorAll("tr").forEach(tr => {
    const cols = Array.from(tr.querySelectorAll("th, td")).map(td => td.innerText);
    text += cols.join("@") + "\n";
  });

  navigator.clipboard.writeText(text)
    .then(()=>{
      // コピー成功後に遷移
      window.location.href = "https://jetkitayan.github.io/memo-save/";
    })
    .catch(()=>alert("コピーに失敗しました。もう一度お試しください。"));
}

function pickLeastShown(remainingArr, excludeEn){
  const n = remainingArr.length;
  if (n === 0) return null;
  if (n === 1) return remainingArr[0];

  let min = Infinity;
  let chosen = null;
  let seen = 0; // min と同値の候補を何個見たか

  for (let i = 0; i < n; i++) {
    const en = remainingArr[i];

    // 直前と同じのを避けたい（ただし残り1なら避けようがない）
    if (en === excludeEn && n > 1) continue;

    const c = shownCounts[en] || 0;

    if (c < min) {
      min = c;
      chosen = en;
      seen = 1;
    } else if (c === min) {
      seen++;
      // 1/seen の確率で置き換える → min同率から一様ランダム
      if ((Math.random() * seen) < 1) chosen = en;
    }
  }

  // excludeで全部飛んだ等の保険
  return chosen ?? remainingArr[0];
}

function pickOldest(remainingArr, excludeEn){
  let oldestEn = null;
  let oldestTime = Infinity;

  for (const en of remainingArr) {
    if (en === excludeEn && remainingArr.length > 1) continue;

    const iso = lastShownMap[en];
    const t = iso ? new Date(iso).getTime() : 0; // 未表示は最古扱い

    if (t < oldestTime) {
      oldestTime = t;
      oldestEn = en;
    }
  }

  return oldestEn ?? remainingArr[0];
}
   
function pickRandomFast(arr, excludeEn){
  const n = arr.length;
  if (n === 0) return null;
  if (n === 1) return arr[0];

  let idx = (Math.random() * n) | 0;
  if (arr[idx] !== excludeEn) return arr[idx];

  // excludeに当たったら、残り(n-1)のどこかへ必ずずらす
  const offset = 1 + ((Math.random() * (n - 1)) | 0);
  idx = (idx + offset) % n;
  return arr[idx];
}

function prepareNext() {
  if (remainingArr.length === 0) {
    nextEn = null;
    return;
  }

  switch (showMode) {
    case 0: // ランダム
      nextEn = pickRandomFast(remainingArr, currentSentence?.en);
      break;

    case 1: // 最少回数
      nextEn = pickLeastShown(remainingArr, currentSentence?.en);
      break;

    case 2: // 最古
      nextEn = pickOldest(remainingArr, currentSentence?.en);
      break;
  }

  // 次回用にモードを進める（0→1→2→0）
  showMode = (showMode + 1) % 3;
}

function buildCountsInlineText(){
  return `（${getLast5MinCount()} / ${getLast1HourCount()} / ${todayShownCached} / ${totalShownCached}）`;
}

/* ===== シンプル Custom 保存 ===== */
const customTextEl = document.getElementById("customText");
const addSimpleBtn = document.getElementById("addSimpleBtn");
const customOnlyBtn = document.getElementById("customOnlyBtn");
const clearCustomBtn = document.getElementById("clearCustomBtn");
const addMsg = document.getElementById("addMsg");

function saveSimple(){
  localStorage.setItem(simpleKey, JSON.stringify(simpleCustomList));
}

function addSimpleSentence(){
  const text = (customTextEl.value || "").trim();
  if (!text){
    addMsg.textContent = "空です";
    return;
  }

  if (simpleCustomList.includes(text)){
    addMsg.textContent = "既に登録済み";
    return;
  }

  simpleCustomList.push(text);
  saveSimple();

  customTextEl.value = "";

  // 画面側にも即反映（リロード不要にする）
  if (!byEn[text]) {
    const obj = { jp: text, en: text };
    allSentences.push(obj);
    byEn[text] = obj;

    // remaining にも入れる（OK対象にしたいなら）
    remainingSet.add(text);
    remainingArr = Array.from(remainingSet);
    markDirty(keyPrefix + "remaining");
  }

  addMsg.textContent = "追加しました";
}

function showRandomCustomOnly(){
  if (simpleCustomList.length === 0){
    alert("Customがありません");
    return;
  }

  const pool = simpleCustomList; // enキーとして使う
  const en = pickRandomFast(pool, currentSentence?.en);
  lastShowMode = "all";
  presentSentenceByEn(en);
}

function clearSimple(){
  if (!confirm("全部削除する？")) return;

  const toRemove = new Set(simpleCustomList.map(t => (t || "").trim()).filter(Boolean));

  // list消す
  simpleCustomList = [];
  saveSimple();

  // 表示データからも除去
  allSentences = allSentences.filter(s => !toRemove.has(s.en));
  for (const t of toRemove) delete byEn[t];

  // remainingからも除去
  remainingSet = new Set(Array.from(remainingSet).filter(en => !toRemove.has(en)));
  remainingArr = Array.from(remainingSet);
  markDirty(keyPrefix + "remaining");

  addMsg.textContent = "削除しました";
}

addSimpleBtn.onclick = addSimpleSentence;
customOnlyBtn.onclick = showRandomCustomOnly;
clearCustomBtn.onclick = clearSimple;

  if (!currentSentence) return;
  if (confirm("OK？")) confirmSentence();
};
document.getElementById("starBtn").onclick = toggleStar;
