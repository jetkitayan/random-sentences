<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>Random English Sentences</title>
<style>
* , *::before, *::after { box-sizing: border-box; }

body {
  font-family: sans-serif;
  margin: 0;
  padding: 0; /* 上余白はJSで自動調整 */
  background-color: #fafafa;
}

/* 上に固定するボタン群 */
#button-area {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 65px 25px 13px 25px;  /* 上 右 下 左 */
  text-align: center;
  z-index: 999;
}

/* 両段で幅をそろえる */
#button-area .row2,
#button-area .row1 {
  max-width: 1100px;
  margin-left: auto;
  margin-right: auto;
}

/* === 上段：Show Random / ☆Only === */
#button-area .row2 {
  display: grid;
  grid-template-columns: 605fr 395fr;  /* ← ここで4:1を厳密指定 */
  gap: 23px;
  max-width: 900px;
  margin: 0 auto;
  width: 100%;
}

/* ボタンは幅100%で受けるだけ（余計なwidth/flexは付けない） */
#button-area .row2 button {
  width: 100%;
  min-width: 0;
  text-align: center;
  border-radius: 16px;
}
  
/* 左右ボタンそれぞれの角丸調整 */
#showBtn {
  border-top-right-radius: 8px;     /* 内側：少し丸く */
  border-bottom-right-radius: 8px;  /* 内側：少し丸く */
}

#showStarBtn {
  border-top-left-radius: 8px;      /* 内側：少し丸く */
  border-bottom-left-radius: 8px;   /* 内側：少し丸く */
}
  
/* === 下段：1段目（OK/☆/Reset/Stats/Mail）=== */
#button-area .row1 {
  display: flex;
  justify-content: center;     /* 中央寄せ */
  align-items: center;
  flex-wrap: nowrap;           /* 1行固定 */
  gap: 25px;
  margin-top: 25px;

  /* ★ 中央寄せのために幅を明示し、左右autoで固定 */
  width: fit-content;
  max-width: 1100px;
  margin-left: auto;
  margin-right: auto;
}

/* 各ボタンを固定幅にして整列 */
#button-area .row1 button {
  /* 固定幅で中央に揃える（合計900pxぴったり：160px×5 + 25px×4） */
  flex: 0 0 160px;
  min-width: 160px;
  max-width: 160px;
  flex: 0 0 160px;   /* 固定幅 */
  width: 160px;
  text-align: center;
}

/* 共通ボタン（文字を水平＆垂直センター） */
button {
  padding: 45px 50px;
  font-size: 40px;
  color: #000;
  border-radius: 16px;
  cursor: pointer;
  border: 3px solid #000;
  background: #fff;
  background-color: #d9d9d9;

  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* 上段の継ぎ目を自然に */
#showStarBtn {                 /* 右半分（☆ Only） */
  border-left-width: 3px;      /* 真ん中の線が太くなりすぎないように */
  border-top-left-radius: 0;
  border-bottom-left-radius: 0;
}

#showBtn {                     /* 左半分（Show Random） */
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
}

#content {
  margin-top: -15px;  /* ベース余白（上はJSで加算） */
  padding-left: 40px;
  max-width: 1100px;
}

/* —— 3行の上下マージンを統一 —— */
#sentence-jp,
#sentence-en,
#last-shown {
  margin: 40px 0;
}

/* 文字サイズなどは従来通り（jp/enのみ共通指定） */
.count-label,
#sentence-jp,
#sentence-en {
  line-height: 1.6;
  font-size: 52px;
  color: #000;
  -webkit-text-size-adjust: none !important;
  text-size-adjust: none !important;
}

.top-meta { white-space: pre-line; }

/* 1行目内の補足メタの下余白で1行目と2行目の間隔を作る */
.top-meta {
  margin: 0;
  padding-bottom: 46px;
}

#statsArea {
  display: none;
  padding: 20px 40px;
}

#statsArea table {
  border-collapse: collapse;
  width: 100%;
}
  
#statsArea th, #statsArea td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: left;
}

/* 旧シングル時代の高さ指定はそのまま利用 */
#showBtn { padding: 80px; }

/* スマホ対応：折返し時も中央寄せ */
@media (max-width: 920px) {
  #button-area .row1 { flex-wrap: wrap; }
  #button-area .row1 button { flex: 0 0 48%; min-width: 0; max-width: none; }
}
</style>
</head>
<body>

<div id="button-area">
  <!-- 表示順：上段＝Show/☆Only、下段＝OKほか -->
  <div class="row2">
    <button id="showBtn">Show Random</button>
    <button id="showStarBtn">☆ Only</button>
  </div>

  <div class="row1">
    <button id="okBtn" disabled>OK</button>
    <button id="starBtn" disabled>☆</button>
    <button id="resetBtn">Reset</button>
    <button id="statsBtn">Stats</button>
    <button id="copyBtn">Copy</button>
  </div>
</div>

<div id="content">
  <div id="sentence-jp">
    <div class="top-meta" id="topMeta">Press "Show Random" to start</div>
    <div id="jpText"></div>
  </div>
  <div id="sentence-en"></div>
  <div id="last-shown"></div>
</div>

<!-- 表示履歴一覧 -->
<div id="statsArea">
  <h3>📊 表示履歴一覧</h3>
  <table>
    <thead>
      <tr>
        <th>日本語</th>
        <th>英語</th>
        <th>YES押下</th>
        <th>☆</th>
        <th>表示回数</th>
      </tr>
    </thead>
    <tbody id="statsBody"></tbody>
  </table>
</div>

<script>
/* ========= 状態 ========= */
let allSentences = [];
const params = new URLSearchParams(window.location.search);
const fileParam = params.get("file") || "default";
const jsonFile = `${fileParam}.json`;
const keyPrefix = `randomApp_${fileParam}_`;

/* 永続データのロード */
let shownCounts = JSON.parse(localStorage.getItem(keyPrefix + "shownCounts")) || {};
let yesMarks    = JSON.parse(localStorage.getItem(keyPrefix + "yesMarks")) || {};
let starMarks   = JSON.parse(localStorage.getItem(keyPrefix + "starMarks")) || {};
let remaining   = JSON.parse(localStorage.getItem(keyPrefix + "remaining")) || [];
let lastShownMap= JSON.parse(localStorage.getItem(keyPrefix + "lastShown")) || {};

let lastShowMode = "all"; // "all" | "star"

/* 今日カウント */
function getTodayYMD() {
  const now = new Date();
  const tz = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
  const y = tz.getFullYear();
  const m = String(tz.getMonth() + 1).padStart(2, '0');
  const d = String(tz.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
const todayKey = getTodayYMD();
const todayCountsKey = keyPrefix + "shownCounts_" + todayKey;
let todayCounts = JSON.parse(localStorage.getItem(todayCountsKey)) || {};

/* キャッシュ集計 */
let totalShownCached = Object.values(shownCounts).reduce((a,b)=>a+(b||0),0);
let todayShownCached = Object.values(todayCounts).reduce((a,b)=>a+(b||0),0);

/* 画面状態 */
let currentSentence = null;
let toggleMode = true; // true: ランダム / false: 最少回数

/* ===== 直近カウントを「分リングバッファ」にする（最終形・超高速） ===== */
const minuteKey = keyPrefix + "minuteRing_v1";

// { baseMin:number, ring:number[60] }
// baseMin = ring[0] が指す Unix 分
let minuteRing = (() => {
  try {
    const o = JSON.parse(localStorage.getItem(minuteKey));
    if (!o || !Number.isFinite(o.baseMin) || !Array.isArray(o.ring) || o.ring.length !== 60) {
      throw 0;
    }
    return o;
  } catch {
    return {
      baseMin: Math.floor(Date.now() / 60000),
      ring: Array(60).fill(0),
    };
  }
})();

let ringSaveScheduled = false;
function scheduleSaveMinuteRing() {
  if (ringSaveScheduled) return;
  ringSaveScheduled = true;
  setTimeout(() => {
    try {
      localStorage.setItem(minuteKey, JSON.stringify(minuteRing));
    } catch {}
    ringSaveScheduled = false;
  }, 300);
}

function advanceRingTo(nowMin) {
  let diff = nowMin - minuteRing.baseMin;
  if (diff <= 0) return;

  if (diff >= 60) {
    minuteRing.ring.fill(0);
    minuteRing.baseMin = nowMin;
    return;
  }

  // shift() をやめて、手動で左詰め（60固定なので速い）
  const r = minuteRing.ring;
  for (let i = 0; i < 60 - diff; i++) r[i] = r[i + diff];
  for (let i = 60 - diff; i < 60; i++) r[i] = 0;

  minuteRing.baseMin = nowMin;
}

function addNowCountFast() {
  const nowMin = Math.floor(Date.now() / 60000);
  advanceRingTo(nowMin);
  minuteRing.ring[59]++;
  scheduleSaveMinuteRing();
}

function getLastMinutesCount(min) {
  const nowMin = Math.floor(Date.now() / 60000);
  advanceRingTo(nowMin);

  const n = Math.min(60, Math.max(1, min));
  let sum = 0;
  for (let i = 60 - n; i < 60; i++) sum += minuteRing.ring[i];
  return sum;
}

const getLast1HourCount = () => getLastMinutesCount(60);
const getLast5MinCount  = () => getLastMinutesCount(5);

function applyTopPadding(extra=35){
  const buttonArea = document.getElementById('button-area');
  requestAnimationFrame(() => {
    const h = buttonArea.getBoundingClientRect().height;
    document.body.style.paddingTop = (h + extra) + 'px';
  });
}
window.addEventListener('load', applyTopPadding);
window.addEventListener('resize', ()=>applyTopPadding());

function humanElapsed(iso){
  try{
    const t=new Date(iso).getTime(), s=Math.floor((Date.now()-t)/1000);
    if(s<60) return `${s}秒前`;
    const m=Math.floor(s/60); if(m<60) return `${m}分前`;
    const h=Math.floor(m/60); if(h<24) return `${h}時間前`;
    return `${Math.floor(h/24)}日前`;
  }catch{return""}
}
function pickRandom(pool, excludeEn){
  if (!Array.isArray(pool) || pool.length===0) return null;
  if (pool.length===1) return pool[0];
  let en;
  do { en = pool[Math.floor(Math.random()*pool.length)] } while (en===excludeEn);
  return en;
}

// ===== 保存を「まとめて」やる（超重要）=====
const dirtyKeys = new Set();
let flushTimer = null;

function markDirty(key) {
  dirtyKeys.add(key);
  if (flushTimer) return;

  // まずはすぐ描画させるため、少し遅らせてからまとめて保存
  flushTimer = setTimeout(flushSaves, 800);
}

function flushSaves() {
  flushTimer = null;

  // アイドル時に回す（対応ブラウザは多い）
  const run = () => {
    try {
      for (const key of dirtyKeys) {
        // keyごとに「今の最新オブジェクト」を保存
        if (key === keyPrefix+"shownCounts") localStorage.setItem(key, JSON.stringify(shownCounts));
        else if (key === todayCountsKey)     localStorage.setItem(key, JSON.stringify(todayCounts));
        else if (key === keyPrefix+"lastShown") localStorage.setItem(key, JSON.stringify(lastShownMap));
        else if (key === keyPrefix+"yesMarks")  localStorage.setItem(key, JSON.stringify(yesMarks));
        else if (key === keyPrefix+"starMarks") localStorage.setItem(key, JSON.stringify(starMarks));
        else if (key === keyPrefix+"remaining") localStorage.setItem(key, JSON.stringify(remaining));
      }
    } catch {}
    dirtyKeys.clear();
  };

  if ("requestIdleCallback" in window) {
    requestIdleCallback(run, { timeout: 1000 });
  } else {
    setTimeout(run, 0);
  }
}

// ページを閉じる/裏に回る直前に強制保存
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushSaves();
});

/* en → sentence のマップ */
const byEn = Object.create(null);

/* ========= データ読み込み ========= */
fetch(jsonFile)
  .then(r => { if(!r.ok) throw new Error(`ファイルが見つかりません: ${jsonFile}`); return r.json(); })
  .then(data => {
    allSentences = data;
    for (const s of allSentences) byEn[s.en] = s;
    if (remaining.length === 0) remaining = allSentences.map(s=>s.en);
    applyTopPadding();
  })
  .catch(err => {
    document.getElementById("sentence-jp").textContent = "❌ JSONファイルの読み込みに失敗しました。";
    document.getElementById("sentence-en").textContent = err.message;
  });

/* ========= スターUI（☆固定表示） ========= */
function updateStarUi(){
  const starBtn = document.getElementById("starBtn");
  if (!currentSentence) {
    starBtn.disabled = true;
  } else {
    starBtn.disabled = false;
  }
  // 見た目は常に☆固定
  starBtn.textContent = "☆";
}

const topMetaEl = document.getElementById("topMeta");
const jpTextEl  = document.getElementById("jpText");
const enEl      = document.getElementById("sentence-en");

function presentSentenceByEn(en){
  const s = byEn[en];
  if (!s) return;
  currentSentence = s;

  // === ① 表示を最優先 ===
  topMetaEl.textContent = "読み込み中…";
  jpTextEl.textContent = s.jp;
  enEl.textContent = s.en;

  // === ② 重い処理は後回し ===
  requestAnimationFrame(() => {
    const newShown = (shownCounts[en]||0) + 1;
    shownCounts[en] = newShown;
    markDirty(keyPrefix+"shownCounts");
    totalShownCached++;

    todayCounts[en] = (todayCounts[en]||0) + 1;
    markDirty(todayCountsKey);
    todayShownCached++;

    addNowCountFast();

    const prevIso = lastShownMap[en];
    const prevText = prevIso ? humanElapsed(prevIso) : "なし";
    lastShownMap[en] = new Date().toISOString();
    markDirty(keyPrefix+"lastShown");

    const totalShownLastHour = getLast1HourCount();
    const totalShownLast5Min = getLast5MinCount();
    const starMark = starMarks[en] ? "★" : "";
    
    if (topMetaEl) {
      topMetaEl.textContent =
        `${newShown}回目${starMark}\n` +
        `${prevText}（ ${totalShownLast5Min} / ${totalShownLastHour} / ${todayShownCached} / ${totalShownCached} ）`;
    }
  });
}

/* ========= 通常ランダム表示 ========= */
function showRandom(){
  if (remaining.length === 0) {
    document.getElementById("sentence-jp").textContent = "すべての英文を表示しました！";
    document.getElementById("sentence-en").textContent = "";
    document.getElementById("last-shown").textContent = "";
    document.getElementById("showBtn").disabled = true;
    document.getElementById("okBtn").disabled = true;
    document.getElementById("starBtn").disabled = true;
    return;
  }

  let en;
  if (toggleMode) {
    en = pickRandom(remaining, currentSentence?.en);
  } else {
    en = pickRandomFast(remaining, currentSentence?.en);
  }

  toggleMode = !toggleMode;

  lastShowMode = "all";
  presentSentenceByEn(en);
}

/* ========= ☆のみランダム表示 ========= */
function showRandomStarred(){
  let pool = remaining.filter(en => !!starMarks[en]);
  if (pool.length === 0) {
    pool = Object.keys(starMarks).filter(en => starMarks[en]);
  }
  if (pool.length === 0) {
    alert("☆が付いた英文がありません。先に『☆』でお気に入り登録してください。");
    return;
  }
  const en = pickRandom(pool, currentSentence?.en);
  lastShowMode = "star";
  presentSentenceByEn(en);
}

/* ========= OK確定 ========= */
function confirmSentence(){
  if (!currentSentence) return;
  yesMarks[currentSentence.en] = true;
  markDirty(keyPrefix+"yesMarks");

  remaining = remaining.filter(s => s !== currentSentence.en);
  markDirty(keyPrefix+"remaining");

  if (remaining.length > 0) showRandom();
  else {
    document.getElementById("sentence-jp").textContent = "すべての英文を表示しました！";
    document.getElementById("sentence-en").textContent = "";
    document.getElementById("last-shown").textContent = "";
    document.getElementById("showBtn").disabled = true;
    document.getElementById("okBtn").disabled = true;
    document.getElementById("starBtn").disabled = true;
  }
}

/* ========= ☆トグル（押したら次へ／見た目は☆固定） ========= */
function toggleStar(){
  if (!currentSentence) return;
  const en = currentSentence.en;
  const now = !starMarks[en];
  starMarks[en] = now;
  markDirty(keyPrefix+"starMarks");

  updateStarUi();  // ラベルは常に「☆」

  if (lastShowMode === "star") showRandomStarred();
  else showRandom();
}

/* ========= リセット ========= */
function clearDailyCounts(){
  const prefix = keyPrefix + "shownCounts_";
  for (let i = localStorage.length - 1; i >= 0; i--) {
    const k = localStorage.key(i);
    if (k && k.startsWith(prefix)) localStorage.removeItem(k);
  }
}
function resetData(){
  if (!confirm("Reset？")) return;
  localStorage.removeItem(keyPrefix+"shownCounts");
  localStorage.removeItem(keyPrefix+"remaining");
  localStorage.removeItem(keyPrefix+"yesMarks");
  localStorage.removeItem(keyPrefix+"lastShown");
  localStorage.removeItem(keyPrefix+"starMarks");
  localStorage.removeItem(hourTsKey);
  localStorage.removeItem(minuteKey);
  minuteRing = { baseMin: Math.floor(Date.now() / 60000), ring: Array(60).fill(0) };
  clearDailyCounts();

  shownCounts = {}; yesMarks = {}; lastShownMap = {}; starMarks = {};
  totalShownCached = 0; todayShownCached = 0;
  todayCounts = {}; localStorage.removeItem(todayCountsKey);

  remaining = allSentences.map(s=>s.en); currentSentence = null;
  document.getElementById("sentence-jp").textContent = "Press 'Show Random' to start";
  document.getElementById("sentence-en").textContent = "";
  document.getElementById("last-shown").textContent = "";
  document.getElementById("showBtn").disabled = false;
  document.getElementById("okBtn").disabled = true;
  document.getElementById("starBtn").disabled = true;
  document.getElementById("statsArea").style.display = "none";
  applyTopPadding();
}

/* ========= Stats & Copy ========= */
function showStats(){
  const tbody = document.getElementById("statsBody");
  tbody.innerHTML = "";
  for (const s of allSentences) {
    const c = shownCounts[s.en] || 0;
    const yes = yesMarks[s.en] ? "●" : "○";
    const star = starMarks[s.en] ? "★" : "☆";
    tbody.innerHTML += `
      <tr>
        <td>${s.en}</td>
        <td>${s.jp}</td>
        <td style="text-align:center;">${yes}</td>
        <td style="text-align:center;">${star}</td>
        <td style="text-align:center;">${c}</td>
      </tr>`;
  }
  document.getElementById("statsArea").style.display = "block";
}
  
function copyStats(){
  const table = document.querySelector("#statsArea table");
  if (!table) { alert("一覧が表示されていません。"); return; }
  let text = "";
  table.querySelectorAll("tr").forEach(tr => {
    const cols = Array.from(tr.querySelectorAll("th, td")).map(td => td.innerText);
    text += cols.join("@") + "\n";
  });

  navigator.clipboard.writeText(text)
    .then(()=>{
      // コピー成功後に遷移
      window.location.href = "https://jetkitayan.github.io/memo-save/";
    })
    .catch(()=>alert("コピーに失敗しました。もう一度お試しください。"));
}

function pickLeastShown(remainingArr, excludeEn){
  const n = remainingArr.length;
  if (n === 0) return null;
  if (n === 1) return remainingArr[0];

  let min = Infinity;
  let chosen = null;
  let seen = 0; // min と同値の候補を何個見たか

  for (let i = 0; i < n; i++) {
    const en = remainingArr[i];

    // 直前と同じのを避けたい（ただし残り1なら避けようがない）
    if (en === excludeEn && n > 1) continue;

    const c = shownCounts[en] || 0;

    if (c < min) {
      min = c;
      chosen = en;
      seen = 1;
    } else if (c === min) {
      seen++;
      // 1/seen の確率で置き換える → min同率から一様ランダム
      if ((Math.random() * seen) < 1) chosen = en;
    }
  }

  // excludeで全部飛んだ等の保険
  return chosen ?? remainingArr[0];
}

function pickRandomFast(arr, excludeEn){
  const n = arr.length;
  if (n === 0) return null;
  if (n === 1) return arr[0];

  let idx = (Math.random() * n) | 0;
  if (arr[idx] !== excludeEn) return arr[idx];

  // excludeに当たったら、残り(n-1)のどこかへ必ずずらす
  const offset = 1 + ((Math.random() * (n - 1)) | 0);
  idx = (idx + offset) % n;
  return arr[idx];
}

/* ========= イベント ========= */
document.getElementById("showBtn").onclick = showRandom;
document.getElementById("showStarBtn").onclick = showRandomStarred;
document.getElementById("okBtn").onclick = () => { if (!currentSentence) return; if (confirm("OK？")) confirmSentence(); };
document.getElementById("resetBtn").onclick = resetData;
document.getElementById("statsBtn").onclick = showStats;
document.getElementById("copyBtn").onclick = copyStats;
document.getElementById("starBtn").onclick = toggleStar;
</script>
</body>
</html>
