<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Random English Sentences</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="button-area">
  <div class="row2">
    <button id="showBtn">Random</button>
    <button id="showBtn2">Random</button>
    <button id="showStarBtn">★ Only</button>
  </div>

  <div class="row1">
    <button id="okBtn" disabled>OK</button>
    <button id="starBtn" disabled>★</button>
    <button id="resetBtn">Reset</button>
    <button id="statsBtn">Stats</button>
    <button id="copyBtn">Copy</button>
  </div>
</div>

<div id="content">
  <div id="sentence-frame">
    <div id="sentence-jp">
      <div class="top-meta" id="topMeta">Press "Random" to start</div>
      <div id="jpText"></div>
    </div>
    <div id="sentence-en"></div>
    <div id="last-shown"></div>
  </div>

  <div id="simpleAddArea">
    <textarea id="customText" placeholder="1文を入力"></textarea>
    <div class="simpleButtons">
      <button id="addSimpleBtn">Add</button>
      <button id="customOnlyBtn">Custom Only</button>
      <button id="clearCustomBtn">Clear</button>
      <button id="exportCustomCsvBtn">Export CSV</button>
    </div>
    <div id="addMsg"></div>
  </div>
</div>

<div id="statsArea">
  <h3>📊 表示履歴一覧</h3>
  <table>
    <thead>
      <tr>
        <th>日本語</th>
        <th>英語</th>
        <th>YES押下</th>
        <th>★</th>
        <th>表示回数</th>
      </tr>
    </thead>
    <tbody id="statsBody"></tbody>
  </table>
</div>

<script src="api.js"></script>
<script src="storage.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
